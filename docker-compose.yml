services:
  redis:
    image: redis:7-alpine
    container_name: snapasset-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build: ./server
    container_name: snapasset-api
    ports:
      - '${API_PORT:-3001}:3001'
      - '${OAUTH_PORT:-1455}:1455'
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-change-me-to-a-random-string-at-least-32-characters}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:-change-me-to-a-random-string-at-least-32-characters}
      - DB_PROVIDER=${DB_PROVIDER:-local}
      - LOCAL_DATA_DIR=/usr/src/app/data
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./server/logs:/usr/src/app/logs
      - app_data:/usr/src/app/data

  worker:
    build: ./server
    command: node workers/imageWorker.js
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-change-me-to-a-random-string-at-least-32-characters}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:-change-me-to-a-random-string-at-least-32-characters}
      - DB_PROVIDER=${DB_PROVIDER:-local}
      - LOCAL_DATA_DIR=/usr/src/app/data
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - app_data:/usr/src/app/data
    deploy:
      replicas: 2

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:${API_PORT:-3001}}
    container_name: snapasset-frontend
    ports:
      - '${FRONTEND_PORT:-5173}:5173'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  app_data:
